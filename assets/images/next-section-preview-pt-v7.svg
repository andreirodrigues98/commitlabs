      <tspan x="630" dy="24">escaláveis e preparados para evoluir.</tspan>
    </text>

    <text x="630" y="633" font-size="12" fill="#0D0D0F">Conheça a Commit Labs →</text>
    <text x="48" y="734" font-size="8" fill="rgba(13,13,15,0.34)" letter-spacing="2.1">LAB / 01</text>
