  <g font-family="Arial, Helvetica, sans-serif" fill="#0D0D0F">
    <text x="74" y="53" font-size="15" font-weight="700">COMMIT LABS</text>
    <text x="48" y="132" font-size="12" font-weight="700" letter-spacing="2.2">● SOBRE A COMMIT LABS</text>

    <text x="48" y="282" font-size="76" font-weight="400" letter-spacing="-4.5">UM LABORATÓRIO</text>
    <text x="48" y="366" font-size="76" font-weight="400" letter-spacing="-4.5">DE TECNOLOGIA</text>
    <text x="48" y="450" font-size="76" font-weight="400" letter-spacing="-4.5">PARA O QUE VEM</text>
    <text x="48" y="534" font-size="76" font-weight="400" letter-spacing="-4.5" fill="#0066FF">A SEGUIR.</text>

    <text x="630" y="342" font-size="17" fill="#121316">
      <tspan x="630" dy="0">A Commit Labs é um laboratório</tspan>
      <tspan x="630" dy="26">independente de tecnologia onde ideias</tspan>
      <tspan x="630" dy="26">são estudadas, desenvolvidas, testadas</tspan>
      <tspan x="630" dy="26">e transformadas em produtos digitais.</tspan>
    </text>

    <text x="630" y="500" font-size="14" fill="rgba(18,19,22,0.58)">
